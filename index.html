<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Fiesta Sorpresa! - El Cumpleaños de Miri</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Contenedor principal de la tarjeta */
    .card-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      background-color: #ffffff;
      /* Patrón de lunares naranja y violeta sutiles en el fondo */
      background-image: 
        radial-gradient(#ff6b2b 20%, transparent 20%),
        radial-gradient(#b24bf3 20%, transparent 20%);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      border-radius: 24px;
      padding: 40px 24px 32px 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.15);
      overflow: hidden;
      text-align: center;
    }

    /* Fondo blanco con opacidad sobre los lunares para asegurar legibilidad */
    .content-overlay {
      background: rgba(255, 255, 255, 0.88);
      border-radius: 20px;
      padding: 24px 16px;
      backdrop-filter: blur(2px);
    }

    /* Animación e imagen del sello TOP SECRET */
    .stamp-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .top-secret-stamp {
      display: inline-block;
      border: 4px dashed #ff5500;
      color: #ff5500;
      font-weight: 900;
      font-size: 1.8rem;
      letter-spacing: 3px;
      padding: 8px 16px;
      border-radius: 8px;
      text-transform: uppercase;
      transform: rotate(-12deg) scale(2);
      opacity: 0;
      animation: stampDrop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.3s;
    }

    @keyframes stampDrop {
      0% {
        opacity: 0;
        transform: rotate(-12deg) scale(3);
      }
      100% {
        opacity: 1;
        transform: rotate(-12deg) scale(1);
      }
    }

    /* Títulos y textos */
    .subtitle {
      color: #c83bf8;
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 12px;
      text-shadow: 1px 1px 0px rgba(0,0,0,0.05);
    }

    .title {
      color: #ff5500;
      font-size: 2.1rem;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .info-group {
      margin-bottom: 20px;
    }

    .date-time {
      color: #c83bf8;
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .address {
      color: #b030e0;
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .note {
      color: #ff5500;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 28px;
    }

    /* Botón de confirmación */
    .btn-confirm {
      display: block;
      width: 100%;
      background: linear-gradient(180deg, #ff6b2b 0%, #f04e0a 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 16px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(240, 78, 10, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-confirm:active {
      transform: scale(0.98);
      box-shadow: 0 3px 8px rgba(240, 78, 10, 0.4);
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="content-overlay">
      
      <!-- Sello Animado -->
      <div class="stamp-wrapper">
        <div class="top-secret-stamp">TOP SECRET</div>
      </div>

      <!-- Encabezados -->
      <h2 class="subtitle">¡FIESTA SORPRESA!</h2>
      <h1 class="title">EL CUMPLEAÑOS<br>DE MIRI</h1>

      <!-- Detalles -->
      <div class="info-group">
        <p class="date-time">Sábado 17 de octubre 3:30 p.m.</p>
        <p class="address">
          Camino de La Amistad 171, Campestre<br>
          Aragón, GAM - CDMX
        </p>
        <p class="note">
          Habrá comida y bebida, pero puedes llevar<br>lo que gustes
        </p>
      </div>

      <!-- Botón WhatsApp -->
      <a href="https://wa.me/525500000000?text=¡Hola!%20Confirmo%20mi%20asistencia%20al%20cumpleaños%20de%20Miri." class="btn-confirm" target="_blank">
        CONFIRMA TU ASISTENCIA
      </a>

    </div>
  </div>

</body>
</html>
