<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Fiesta Sorpresa! - El Cumpleaños de Miri</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      background-color: #ffffff;
      background-image: 
        radial-gradient(#ff6b2b 20%, transparent 20%),
        radial-gradient(#b24bf3 20%, transparent 20%);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      border-radius: 24px;
      padding: 32px 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.15);
      overflow: hidden;
      text-align: center;
    }

    .content-overlay {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 20px;
      padding: 24px 16px;
      backdrop-filter: blur(3px);
    }

    .stamp-wrapper {
      position: relative;
      margin-bottom: 16px;
    }

    .top-secret-stamp {
      display: inline-block;
      border: 4px dashed #ff5500;
      color: #ff5500;
      font-weight: 900;
      font-size: 1.7rem;
      letter-spacing: 2px;
      padding: 6px 14px;
      border-radius: 8px;
      text-transform: uppercase;
      transform: rotate(-12deg) scale(1);
      animation: stampDrop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes stampDrop {
      0% { opacity: 0; transform: rotate(-12deg) scale(3); }
      100% { opacity: 1; transform: rotate(-12deg) scale(1); }
    }

    .subtitle {
      color: #c83bf8;
      font-size: 1.4rem;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .title {
      color: #ff5500;
      font-size: 1.9rem;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .info-group {
      margin-bottom: 20px;
    }

    .date-time {
      color: #c83bf8;
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .address {
      color: #b030e0;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .note {
      color: #ff5500;
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 20px;
    }

    /* Formulario de registro */
    .rsvp-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: #ff5500;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(180deg, #ff6b2b 0%, #f04e0a 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 1rem;
      padding: 14px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(240, 78, 10, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="content-overlay">
      
      <!-- Sello Animado -->
      <div class="stamp-wrapper">
        <div class="top-secret-stamp">TOP SECRET</div>
      </div>

      <!-- Encabezados -->
      <h2 class="subtitle">¡FIESTA SORPRESA!</h2>
      <h1 class="title">EL CUMPLEAÑOS<br>DE MIRI</h1>

      <!-- Detalles -->
      <div class="info-group">
        <p class="date-time">Sábado 17 de octubre 3:30 p.m.</p>
        <p class="address">
          Camino de La Amistad 171, Campestre<br>
          Aragón, GAM - CDMX
        </p>
        <p class="note">
          Habrá comida y bebida, pero puedes llevar<br>lo que gustes
        </p>
      </div>

      <!-- FORMULARIO CONECTADO A NETLIFY -->
      <form class="rsvp-form" name="asistencia-miri" method="POST" data-netlify="true">
        <!-- Input oculto obligatorio para procesar formularios en Netlify -->
        <input type="hidden" name="form-name" value="asistencia-miri" />

        <input 
          type="text" 
          name="nombre" 
          class="form-input" 
          placeholder="Tu nombre completo" 
          required 
        />

        <input 
          type="number" 
          name="acompanantes" 
          class="form-input" 
          placeholder="¿Cuántos acompañantes vas a llevar?" 
          min="0" 
          value="0" 
          required 
        />

        <button type="submit" class="btn-submit">
          CONFIRMAR ASISTENCIA
        </button>
      </form>

    </div>
  </div>

</body>
</html>
