<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiesta Sorpresa de Miri</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Bungee&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #ff6d21;
      --fuchsia: #f657bd;
      --purple: #c95cec;
      --bg-color: #f7f5f8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', sans-serif;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* TARJETA ESTILO IMAGEN 2 */
    .card {
      position: relative;
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #fdfbfd;
      background-image: 
        radial-gradient(#f657bd 15%, transparent 16%),
        radial-gradient(#ff6d21 15%, transparent 16%),
        radial-gradient(#c95cec 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px, 15px 45px;
      padding: 40px 25px 50px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    }

    @media (min-height: 750px) {
      .card {
        min-height: 90vh;
        border-radius: 24px;
        margin: 20px 0;
      }
    }

    /* ANIMACIÓN DEL SELLO TOP SECRET */
    .stamp-wrapper {
      margin-top: 10px;
      margin-bottom: 20px;
      perspective: 1000px;
    }

    .top-secret-stamp {
      display: inline-block;
      border: 6px dashed var(--orange);
      color: var(--orange);
      font-family: 'Bungee', cursive, sans-serif;
      font-size: 38px;
      letter-spacing: 3px;
      padding: 8px 25px;
      border-radius: 12px;
      text-transform: uppercase;
      transform: rotate(-12deg) scale(1);
      opacity: 0;
      animation: stampFall 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045) 0.3s forwards,
                 stampImpact 0.2s ease-in-out 1.1s forwards;
      box-shadow: inset 0 0 0 2px var(--orange);
      text-shadow: 1px 1px 0px rgba(0,0,0,0.05);
    }

    @keyframes stampFall {
      0% {
        opacity: 0;
        transform: rotate(-25deg) scale(5) translateY(-300px);
      }
      80% {
        opacity: 0.9;
        transform: rotate(-12deg) scale(0.95) translateY(0);
      }
      100% {
        opacity: 1;
        transform: rotate(-12deg) scale(1.05);
      }
    }

    @keyframes stampImpact {
      0% { transform: rotate(-12deg) scale(1.05); }
      50% { transform: rotate(-11deg) scale(0.98); }
      100% { transform: rotate(-12deg) scale(1); }
    }

    /* TÍTULOS Y TEXTOS */
    .subtitle {
      color: var(--fuchsia);
      font-size: 26px;
      font-weight: 700;
      margin: 15px 0 10px 0;
      letter-spacing: 1px;
    }

    .main-title {
      color: var(--orange);
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 34px;
      line-height: 1.15;
      margin: 0 0 25px 0;
      text-transform: uppercase;
    }

    .info-box {
      margin: 10px 0;
    }

    .date-time {
      color: var(--fuchsia);
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .location {
      color: var(--purple);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
      max-width: 320px;
      margin: 0 auto 20px auto;
    }

    .note {
      color: var(--orange);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      max-width: 300px;
      margin: 0 auto;
    }

    /* BOTÓN PRINCIPAL */
    .btn-confirm {
      display: inline-block;
      width: 100%;
      max-width: 340px;
      background: var(--orange);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 17px;
      padding: 16px 20px;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 5px 0 #d9510a, 0 10px 20px rgba(255, 109, 33, 0.35);
      margin-top: 30px;
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }

    .btn-confirm:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #d9510a, 0 12px 22px rgba(255, 109, 33, 0.45);
    }

    .btn-confirm:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #d9510a;
    }

    /* CINTAS Y CONFETI DECORATIVO VECTORIAL */
    .decor {
      position: absolute;
      pointer-events: none;
    }

    .ribbon-1 { top: 25px; left: 20px; width: 45px; height: 45px; }
    .star-1 { top: 35px; right: 25px; width: 40px; height: 40px; }
    .ribbon-2 { top: 38%; right: 15px; width: 50px; height: 50px; }
    .star-2 { top: 45%; left: 15px; width: 45px; height: 45px; }
    .star-3 { bottom: 35px; right: 25px; width: 45px; height: 45px; }
    .ribbon-3 { bottom: 30px; left: 20px; width: 50px; height: 50px; }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- ELEMENTOS DECORATIVOS SVGs (Estilo Imagen 2) -->
    <svg class="decor ribbon-1" viewBox="0 0 100 100">
      <path d="M10,30 Q40,10 50,50 T90,70" fill="none" stroke="#ff6d21" stroke-width="12" stroke-linecap="round"/>
    </svg>
    
    <svg class="decor star-1" viewBox="0 0 100 100">
      <polygon points="50,5 64,36 98,36 70,57 81,91 50,70 19,91 30,57 2,36 36,36" fill="#f657bd"/>
    </svg>

    <svg class="decor ribbon-2" viewBox="0 0 100 100">
      <path d="M20,80 C40,20 60,90 80,20" fill="none" stroke="#c95cec" stroke-width="10" stroke-linecap="round"/>
    </svg>

    <svg class="decor star-2" viewBox="0 0 100 100">
      <polygon points="50,5 64,36 98,36 70,57 81,91 50,70 19,91 30,57 2,36 36,36" fill="#c95cec" opacity="0.7"/>
    </svg>

    <svg class="decor star-3" viewBox="0 0 100 100">
      <polygon points="50,5 64,36 98,36 70,57 81,91 50,70 19,91 30,57 2,36 36,36" fill="#f657bd"/>
    </svg>

    <svg class="decor ribbon-3" viewBox="0 0 100 100">
      <path d="M10,20 Q50,90 90,30" fill="none" stroke="#f657bd" stroke-width="10" stroke-linecap="round"/>
    </svg>

    <!-- SELLO CON ANIMACIÓN DE CAÍDA -->
    <div class="stamp-wrapper">
      <div class="top-secret-stamp">TOP SECRET</div>
    </div>

    <!-- TEXTOS PRINCIPALES -->
    <div class="subtitle">¡FIESTA SORPRESA!</div>
    <h1 class="main-title">EL CUMPLEAÑOS<br>DE MIRI</h1>

    <!-- INFORMACIÓN DEL EVENTO -->
    <div class="info-box">
      <div class="date-time">Sábado 17 de octubre 3:30 p.m.</div>
      <div class="location">
        Camino de La Amistad 171, Campestre Aragón, GAM - CDMX
      </div>
      <div class="note">
        Habrá comida y bebida, pero puedes llevar lo que gustes
      </div>
    </div>

    <!-- BOTÓN DE CONFIRMACIÓN -->
    <a href="registro.html" class="btn-confirm">CONFIRMA TU ASISTENCIA</a>

  </div>

</body>
</html>
