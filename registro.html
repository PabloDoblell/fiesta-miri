<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro & Detalles - Fiesta Miri</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #ff6d21;
      --fuchsia: #f657bd;
      --purple: #c95cec;
      --bg: #f5f6f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Fredoka', sans-serif;
      background-color: var(--bg);
      color: #333;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 2px dashed var(--fuchsia);
    }

    h1, h2 {
      text-align: center;
      color: var(--purple);
      margin-top: 0;
    }

    .section {
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: 600;
      color: var(--orange);
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--fuchsia);
    }

    button, .btn-wa {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      background: var(--orange);
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 0 #c54a12;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    button:hover, .btn-wa:hover {
      filter: saturate(1.1);
      transform: translateY(-2px);
    }

    .btn-wa {
      background: #25D366;
      box-shadow: 0 4px 0 #1da851;
      margin-top: 10px;
    }

    .map-container {
      width: 100%;
      height: 220px;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 10px;
      border: 2px solid var(--purple);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .admin-sec {
      background: #fdf5fc;
      padding: 15px;
      border-radius: 12px;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: var(--purple);
      color: white;
    }

    .alert-msg {
      color: #27ae60;
      font-weight: bold;
      text-align: center;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Confirmación de Asistencia</h1>

  <!-- FORMULARIO DE REGISTRO -->
  <div class="section">
    <form id="rsvpForm">
      <label for="nombre">Nombre Completo:</label>
      <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>

      <label for="personas">Número de Personas:</label>
      <input type="number" id="personas" min="1" max="10" value="1" required>

      <label for="hora">Hora Estimada de Llegada:</label>
      <input type="time" id="hora" required>

      <button type="submit">CONFIRMAR REGISTRO</button>
      <div id="alertMsg" class="alert-msg">¡Gracias! Tu registro ha sido guardado.</div>
    </form>
  </div>

  <!-- MAPA GOOGLE MAPS -->
  <div class="section">
    <h2>Ubicación del Evento</h2>
    <p style="font-size: 14px; text-align: center;">Camino de la Amistad 171, Campestre Aragón, GAM - CDMX</p>
    <div class="map-container">
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3761.383792078652!2d-99.07187122394787!3d19.482087981807494!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d1fb1b642aa371%3A0xb231713d78c3b7a5!2sCamino%20a%20la%20Amistad%20171%2C%20Campestre%20Arag%C3%B3n%2C%20Gustavo%20A.%20Madero%2C%2007520%20Ciudad%20de%20M%C3%A9xico%2C%20CDMX!5e0!3m2!1ses-419!2smx!4v1700000000000!5m2!1ses-419!2smx" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>
  </div>

  <!-- CONTACTO POR WHATSAPP -->
  <div class="section" style="border-bottom: none;">
    <h2>¿Tienes alguna duda?</h2>
    <!-- Reemplaza '5215500000000' por el número real del anfitrión con código de país -->
    <a href="https://wa.me/5215500000000?text=Hola,%20tengo%20una%20duda%20sobre%20la%20fiesta%20sorpresa%20de%20Miri" target="_blank" class="btn-wa">
      Contactar al Anfitrión por WhatsApp
    </a>
  </div>

  <!-- PANEL DE ADMINISTRADOR -->
  <div class="admin-sec">
    <button type="button" id="toggleAdminBtn" style="background: var(--purple); box-shadow: 0 4px 0 #8c3bb4;">Acceso Administrador</button>
    <div id="adminPanel" style="display: none; margin-top: 15px;">
      <h3>Lista de Asistentes Confirmados</h3>
      <table id="asistentesTable">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Personas</th>
            <th>Hora</th>
          </tr>
        </thead>
        <tbody>
          <!-- Se llena dinámicamente -->
        </tbody>
      </table>
      <button type="button" id="clearDataBtn" style="background: #e74c3c; box-shadow: 0 4px 0 #962d22; margin-top: 10px;">Limpiar Datos</button>
    </div>
  </div>

</div>

<script>
  // Manejo del envío del formulario
  const form = document.getElementById('rsvpForm');
  const alertMsg = document.getElementById('alertMsg');

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const registro = {
      nombre: document.getElementById('nombre').value,
      personas: document.getElementById('personas').value,
      hora: document.getElementById('hora').value
    };

    // Obtener lista previa o inicializar vacía
    let registros = JSON.parse(localStorage.getItem('registrosMiri')) || [];
    registros.push(registro);

    // Guardar en localStorage
    localStorage.setItem('registrosMiri', JSON.stringify(registros));

    // Mostrar mensaje de éxito y limpiar campos
    alertMsg.style.display = 'block';
    form.reset();
    setTimeout(() => { alertMsg.style.display = 'none'; }, 4000);

    // Actualizar tabla si el panel admin está abierto
    cargarTablaAdmin();
  });

  // Lógica del Panel Administrador
  const toggleAdminBtn = document.getElementById('toggleAdminBtn');
  const adminPanel = document.getElementById('adminPanel');
  const clearDataBtn = document.getElementById('clearDataBtn');

  toggleAdminBtn.addEventListener('click', () => {
    if (adminPanel.style.display === 'none') {
      const password = prompt('Ingresa la contraseña de administrador:');
      // Contraseña predeterminada: 1234
      if (password === '081408') {
        adminPanel.style.display = 'block';
        cargarTablaAdmin();
      } else if (password !== null) {
        alert('Contraseña incorrecta');
      }
    } else {
      adminPanel.style.display = 'none';
    }
  });

  function cargarTablaAdmin() {
    const tbody = document.querySelector('#asistentesTable tbody');
    tbody.innerHTML = '';
    const registros = JSON.parse(localStorage.getItem('registrosMiri')) || [];

    if (registros.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Sin registros aún</td></tr>';
      return;
    }

    registros.forEach(reg => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${reg.nombre}</td><td>${reg.personas}</td><td>${reg.hora}</td>`;
      tbody.appendChild(tr);
    });
  }

  clearDataBtn.addEventListener('click', () => {
    if (confirm('¿Estás seguro de que deseas borrar todos los registros?')) {
      localStorage.removeItem('registrosMiri');
      cargarTablaAdmin();
    }
  });
</script>

</body>
</html>
